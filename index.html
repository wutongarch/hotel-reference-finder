<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference Finder V1</title><style>body{font-family:Arial,sans-serif;background:#f3f1eb;color:#17251d;margin:0}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{font-size:42px;letter-spacing:-2px}.bar{display:flex;gap:10px;margin:22px 0}.bar input{flex:1;padding:15px;border:1px solid #ddd;border-radius:14px}.bar button,.actions button{background:#17251d;color:white;border:0;border-radius:14px;padding:12px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #ddd}.pic{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e6e3db}.meta{padding:14px}.select{margin-top:10px;border:1px solid #bbb;background:white;border-radius:20px;padding:8px 12px}.select.on{background:#17251d;color:white}.actions{position:sticky;bottom:14px;margin:24px auto 0;background:#17251d;color:white;padding:12px 16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;max-width:520px}.actions button{background:white;color:#17251d}.hint{color:#666;font-size:13px}</style></head><body><main class="wrap"><div class="hero">Reference Finder</div><p>Hospitality Design Image Board · GitHub V1</p><div class="bar"><input value="Pool / Aman / 海边 / 自然石材 / 安静高级"><button>Search references</button></div><p class="hint">V1 uses repository-hosted images, not third-party hotlinks.</p><section class="grid" id="grid"></section><div class="actions"><span id="count">0 selected</span><button onclick="downloadSelected()">Download selected</button></div></main><script>
const items=Array.from({length:6},(_,i)=>({id:i+1,title:`Reference ${String(i+1).padStart(2,'0')}`,img:`images/reference-${i+1}.svg`})); const chosen=new Set();
const grid=document.getElementById('grid'); function render(){grid.innerHTML=items.map(x=>`<article class="card"><img class="pic" src="${x.img}" alt="${x.title}"><div class="meta"><b>${x.title}</b><div class="hint">Local repository image</div><button class="select ${chosen.has(x.id)?'on':''}" onclick="toggle(${x.id})">${chosen.has(x.id)?'Selected':'Select'}</button></div></article>`).join('');document.getElementById('count').textContent=`${chosen.size} selected`} function toggle(id){chosen.has(id)?chosen.delete(id):chosen.add(id);render()} function downloadSelected(){if(!chosen.size){alert('Select at least one image.');return} [...chosen].forEach((id,n)=>setTimeout(()=>{const a=document.createElement('a');a.href=items[id-1].img;a.download=`reference-${id}.svg`;a.click()},n*250))} render();
</script></body></html>
